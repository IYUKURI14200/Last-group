<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team</title>
  <!-- External CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== HEADER ========== -->
  <header class="site-header">
    <h1>Meet Our Team</h1>
    <p>We learn by building together.</p>
  </header>

  <!-- ========== NAVIGATION ========== -->
  <nav class="site-nav">
    <a href="#about">About</a>
    <a href="#goals">Goals</a>
    <a href="#members">Members</a>
    <a href="#contact">Contact</a>
  </nav>

  <!-- ========== MAIN CONTENT ========== -->
  <main>

    <section id="about" class="card">
      <h2>About Us</h2>
      <p>We are students learning HTML.</p>
      <!-- Image added with HTML only -->
      <img src="images/background.jpg" alt="A street view with the Capitol building in the distance">
    </section>

    <section id="goals" class="card">
      <h2>Our Goals</h2>
      <ul>
        <li>Learn</li>
        <li>Build</li>
        <li>Share</li>
      </ul>
    </section>

    <section id="members" class="card">
      <h2>Our Members</h2>
      <div class="members-grid">
        <article class="member">
          <h3>Member 1</h3>
          <p>Project Leader</p>
        </article>
        <article class="member">
          <h3>Member 2</h3>
          <p>Designer</p>
        </article>
        <article class="member">
          <h3>Member 3</h3>
          <p>Writer</p>
        </article>
      </div>
    </section>

    <section id="contact" class="card">
      <h2>Contact Us</h2>
      <p>Email: <a href="mailto:team@example.com">team@example.com</a></p>
    </section>

  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="site-footer">
    <p>Made by our team.</p>
  </footer>

</body>
</html>
